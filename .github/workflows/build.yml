# Compila DOMI para Mac, Windows y Android.
# - En cada push: compila para comprobar que todo funciona.
# - Al publicar un Release en GitHub: adjunta DOMI-mac.dmg, DOMI-windows.exe y DOMI-android.apk.
name: Instaladores DOMI

on:
  push:
    branches: [main, 'claude/**']
    paths-ignore: ['**.md', 'site/**']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Versión mostrada en la app (toma el tag del release, p. ej. v1.2.0 -> 1.2.0)
  DOMI_VERSION_NAME: ${{ github.event_name == 'release' && github.event.release.tag_name || '1.0.0' }}

jobs:
  desktop:
    name: Escritorio (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mac
            os: macos-latest
            script: dist:mac
            file: dist/DOMI-mac.dmg
          - name: Windows
            os: windows-latest
            script: dist:win
            file: dist/DOMI-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ajustar versión
        shell: bash
        run: npm pkg set version="${DOMI_VERSION_NAME#v}"
      - name: Empaquetar
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Confirmar instalador
        shell: bash
        run: ls -lh "${{ matrix.file }}"
      # Se sube directo al Release (sin artifacts intermedios, que consumen cuota de almacenamiento)
      - name: Adjuntar al Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.file }}

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Copiar la app web al proyecto Android
        run: npx cap sync android
      - name: Compilar APK
        working-directory: android
        env:
          DOMI_VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          DOMI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export DOMI_VERSION_NAME="${DOMI_VERSION_NAME#v}"
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ] && [ -n "$DOMI_KEYSTORE_PASSWORD" ]; then
            # Versión firmada con la llave privada de DOMI (la que se publica)
            export DOMI_KEYSTORE_PATH="$RUNNER_TEMP/domi-release.p12"
            echo "$KEYSTORE_B64" | base64 -d > "$DOMI_KEYSTORE_PATH"
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../DOMI-android.apk
            rm -f "$DOMI_KEYSTORE_PATH"
          elif [ "${{ github.event_name }}" = "release" ]; then
            echo "::error::Faltan los secretos ANDROID_KEYSTORE_BASE64 y ANDROID_KEYSTORE_PASSWORD. Agrégalos en Settings → Secrets and variables → Actions antes de publicar."
            exit 1
          else
            # Compilación de prueba (sin llave privada): solo verifica que todo compile
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../DOMI-android.apk
          fi
      - name: Confirmar instalador
        run: ls -lh DOMI-android.apk
      - name: Adjuntar al Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: DOMI-android.apk
